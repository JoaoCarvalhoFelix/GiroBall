<script type="module">

/* ============================================================
   LOG DE REDE
   ============================================================ */
let netlogEl = null;
const netlogEntries = [];
function renderNetlog() {
  if (!netlogEl) return;
  const fragment = document.createDocumentFragment();
  for (const { ts, msg, cls } of netlogEntries) {
    const time = document.createElement('span');
    time.className = 't';
    time.textContent = `[${ts}]`;
    fragment.append(time, ' ');
    if (cls) {
      const body = document.createElement('span');
      body.className = cls;
      body.textContent = msg;
      fragment.append(body);
    } else {
      fragment.append(msg);
    }
    fragment.append('\n');
  }
  netlogEl.replaceChildren(fragment);
  netlogEl.scrollTop = netlogEl.scrollHeight;
}
function netlog(msg, cls = '') {
  const ts = new Date().toLocaleTimeString('pt-PT', { hour12: false });
  msg = String(msg);
  console.log('[net]', msg);
  netlogEntries.push({ ts, msg, cls });
  if (netlogEntries.length > 500) netlogEntries.shift();
  renderNetlog();
}

async function copyNetlog(event) {
  const button = event.currentTarget;
  const report = `Jogo: ${GAME_BUILD}\nPágina: ${location.origin + location.pathname}\nNavegador: ${navigator.userAgent}\n` +
    netlogEntries.map(({ ts, msg }) => `[${ts}] ${msg}`).join('\n');
  try {
    await navigator.clipboard.writeText(report);
    button.textContent = 'Diagnóstico copiado ✓';
  } catch (_) {
    button.textContent = 'Não foi possível copiar';
  }
}

document.addEventListener('visibilitychange', () =>
  netlog('página ' + document.visibilityState));
window.addEventListener('online', () => netlog('navegador online'));
window.addEventListener('offline', () => netlog('navegador offline', 'er'));

/* ============================================================
   Utils / Constantes
   ============================================================ */
const DEG = Math.PI / 180;
const GAME_BUILD = '2026.10.13.8';
const buildInfo = document.getElementById('buildInfo');
buildInfo.textContent = 'Jogo ' + GAME_BUILD;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;

const FIELD_W = 12, FIELD_L = 18;
const HW = FIELD_W / 2, HL = FIELD_L / 2;
const GOAL_W = 3.6, GOAL_D = 1.6;
const RAMP_R = 1.3, CORNER_R = 1.8;
const WALL_T = 0.5, WALL_H = 1.5;
const BALL_R = 0.7;
const FOOTBALL_R = 0.43;
const PHYSICS=Object.freeze({response:9,speed:8,playerMass:2,ballMass:.45,bounce:.55,drag:.18,kickForce:7,reach:.5,chargeTime:1.1,cooldown:.4,fatigue:34,recovery:16,sensitivity:1});

const MAX_TILT  = 0.45;
const DEADZONE  = 0.03;

const INVERT_X = 1;
const INVERT_Y = -1;

/* ============================================================
   Renderer / Cena / Câmara
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Embedded Three.js r160 FXAA shader: no additional startup request.
/**
 * NVIDIA FXAA by Timothy Lottes
 * https://developer.download.nvidia.com/assets/gamedev/files/sdk/11/FXAA_WhitePaper.pdf
 * - WebGL port by @supereggbert
 * http://www.glge.org/demos/fxaa/
 * Further improved by Daniel Sturk
 */

const FXAAShader = {

	name: 'FXAAShader',

	uniforms: {

		'tDiffuse': { value: null },
		'resolution': { value: new THREE.Vector2( 1 / 1024, 1 / 512 ) }

	},

	vertexShader: /* glsl */`

		varying vec2 vUv;

		void main() {

			vUv = uv;
			gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );

		}`,

	fragmentShader: /* glsl */`
		precision highp float;

		uniform sampler2D tDiffuse;

		uniform vec2 resolution;

		varying vec2 vUv;

		// FXAA 3.11 implementation by NVIDIA, ported to WebGL by Agost Biro (biro@archilogic.com)

		//----------------------------------------------------------------------------------
		// File:        es3-kepler\FXAA\assets\shaders/FXAA_DefaultES.frag
		// SDK Version: v3.00
		// Email:       gameworks@nvidia.com
		// Site:        http://developer.nvidia.com/
		//
		// Copyright (c) 2014-2015, NVIDIA CORPORATION. All rights reserved.
		//
		// Redistribution and use in source and binary forms, with or without
		// modification, are permitted provided that the following conditions
		// are met:
		//  * Redistributions of source code must retain the above copyright
		//    notice, this list of conditions and the following disclaimer.
		//  * Redistributions in binary form must reproduce the above copyright
		//    notice, this list of conditions and the following disclaimer in the
		//    documentation and/or other materials provided with the distribution.
		//  * Neither the name of NVIDIA CORPORATION nor the names of its
		//    contributors may be used to endorse or promote products derived
		//    from this software without specific prior written permission.
		//
		// THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS ''AS IS'' AND ANY
		// EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE
		// IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR
		// PURPOSE ARE DISCLAIMED.  IN NO EVENT SHALL THE COPYRIGHT OWNER OR
		// CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL,
		// EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED TO,
		// PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE, DATA, OR
		// PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY
		// OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT
		// (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE
		// OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.
		//
		//----------------------------------------------------------------------------------

		#ifndef FXAA_DISCARD
			//
			// Only valid for PC OpenGL currently.
			// Probably will not work when FXAA_GREEN_AS_LUMA = 1.
			//
			// 1 = Use discard on pixels which don't need AA.
			//     For APIs which enable concurrent TEX+ROP from same surface.
			// 0 = Return unchanged color on pixels which don't need AA.
			//
			#define FXAA_DISCARD 0
		#endif

		/*--------------------------------------------------------------------------*/
		#define FxaaTexTop(t, p) texture2D(t, p, -100.0)
		#define FxaaTexOff(t, p, o, r) texture2D(t, p + (o * r), -100.0)
		/*--------------------------------------------------------------------------*/

		#define NUM_SAMPLES 5

		// assumes colors have premultipliedAlpha, so that the calculated color contrast is scaled by alpha
		float contrast( vec4 a, vec4 b ) {
			vec4 diff = abs( a - b );
			return max( max( max( diff.r, diff.g ), diff.b ), diff.a );
		}

		/*============================================================================

									FXAA3 QUALITY - PC

		============================================================================*/

		/*--------------------------------------------------------------------------*/
		vec4 FxaaPixelShader(
			vec2 posM,
			sampler2D tex,
			vec2 fxaaQualityRcpFrame,
			float fxaaQualityEdgeThreshold,
			float fxaaQualityinvEdgeThreshold
		) {
			vec4 rgbaM = FxaaTexTop(tex, posM);
			vec4 rgbaS = FxaaTexOff(tex, posM, vec2( 0.0, 1.0), fxaaQualityRcpFrame.xy);
			vec4 rgbaE = FxaaTexOff(tex, posM, vec2( 1.0, 0.0), fxaaQualityRcpFrame.xy);
			vec4 rgbaN = FxaaTexOff(tex, posM, vec2( 0.0,-1.0), fxaaQualityRcpFrame.xy);
			vec4 rgbaW = FxaaTexOff(tex, posM, vec2(-1.0, 0.0), fxaaQualityRcpFrame.xy);
			// . S .
			// W M E
			// . N .

			bool earlyExit = max( max( max(
					contrast( rgbaM, rgbaN ),
					contrast( rgbaM, rgbaS ) ),
					contrast( rgbaM, rgbaE ) ),
					contrast( rgbaM, rgbaW ) )
					< fxaaQualityEdgeThreshold;
			// . 0 .
			// 0 0 0
			// . 0 .

			#if (FXAA_DISCARD == 1)
				if(earlyExit) FxaaDiscard;
			#else
				if(earlyExit) return rgbaM;
			#endif

			float contrastN = contrast( rgbaM, rgbaN );
			float contrastS = contrast( rgbaM, rgbaS );
			float contrastE = contrast( rgbaM, rgbaE );
			float contrastW = contrast( rgbaM, rgbaW );

			float relativeVContrast = ( contrastN + contrastS ) - ( contrastE + contrastW );
			relativeVContrast *= fxaaQualityinvEdgeThreshold;

			bool horzSpan = relativeVContrast > 0.;
			// . 1 .
			// 0 0 0
			// . 1 .

			// 45 deg edge detection and corners of objects, aka V/H contrast is too similar
			if( abs( relativeVContrast ) < .3 ) {
				// locate the edge
				vec2 dirToEdge;
				dirToEdge.x = contrastE > contrastW ? 1. : -1.;
				dirToEdge.y = contrastS > contrastN ? 1. : -1.;
				// . 2 .      . 1 .
				// 1 0 2  ~=  0 0 1
				// . 1 .      . 0 .

				// tap 2 pixels and see which ones are "outside" the edge, to
				// determine if the edge is vertical or horizontal

				vec4 rgbaAlongH = FxaaTexOff(tex, posM, vec2( dirToEdge.x, -dirToEdge.y ), fxaaQualityRcpFrame.xy);
				float matchAlongH = contrast( rgbaM, rgbaAlongH );
				// . 1 .
				// 0 0 1
				// . 0 H

				vec4 rgbaAlongV = FxaaTexOff(tex, posM, vec2( -dirToEdge.x, dirToEdge.y ), fxaaQualityRcpFrame.xy);
				float matchAlongV = contrast( rgbaM, rgbaAlongV );
				// V 1 .
				// 0 0 1
				// . 0 .

				relativeVContrast = matchAlongV - matchAlongH;
				relativeVContrast *= fxaaQualityinvEdgeThreshold;

				if( abs( relativeVContrast ) < .3 ) { // 45 deg edge
					// 1 1 .
					// 0 0 1
					// . 0 1

					// do a simple blur
					return mix(
						rgbaM,
						(rgbaN + rgbaS + rgbaE + rgbaW) * .25,
						.4
					);
				}

				horzSpan = relativeVContrast > 0.;
			}

			if(!horzSpan) rgbaN = rgbaW;
			if(!horzSpan) rgbaS = rgbaE;
			// . 0 .      1
			// 1 0 1  ->  0
			// . 0 .      1

			bool pairN = contrast( rgbaM, rgbaN ) > contrast( rgbaM, rgbaS );
			if(!pairN) rgbaN = rgbaS;

			vec2 offNP;
			offNP.x = (!horzSpan) ? 0.0 : fxaaQualityRcpFrame.x;
			offNP.y = ( horzSpan) ? 0.0 : fxaaQualityRcpFrame.y;

			bool doneN = false;
			bool doneP = false;

			float nDist = 0.;
			float pDist = 0.;

			vec2 posN = posM;
			vec2 posP = posM;

			int iterationsUsed = 0;
			int iterationsUsedN = 0;
			int iterationsUsedP = 0;
			for( int i = 0; i < NUM_SAMPLES; i++ ) {
				iterationsUsed = i;

				float increment = float(i + 1);

				if(!doneN) {
					nDist += increment;
					posN = posM + offNP * nDist;
					vec4 rgbaEndN = FxaaTexTop(tex, posN.xy);
					doneN = contrast( rgbaEndN, rgbaM ) > contrast( rgbaEndN, rgbaN );
					iterationsUsedN = i;
				}

				if(!doneP) {
					pDist += increment;
					posP = posM - offNP * pDist;
					vec4 rgbaEndP = FxaaTexTop(tex, posP.xy);
					doneP = contrast( rgbaEndP, rgbaM ) > contrast( rgbaEndP, rgbaN );
					iterationsUsedP = i;
				}

				if(doneN || doneP) break;
			}


			if ( !doneP && !doneN ) return rgbaM; // failed to find end of edge

			float dist = min(
				doneN ? float( iterationsUsedN ) / float( NUM_SAMPLES - 1 ) : 1.,
				doneP ? float( iterationsUsedP ) / float( NUM_SAMPLES - 1 ) : 1.
			);

			// hacky way of reduces blurriness of mostly diagonal edges
			// but reduces AA quality
			dist = pow(dist, .5);

			dist = 1. - dist;

			return mix(
				rgbaM,
				rgbaN,
				dist * .5
			);
		}

		void main() {
			const float edgeDetectionQuality = .1;
			const float invEdgeDetectionQuality = 1. / edgeDetectionQuality;

			gl_FragColor = FxaaPixelShader(
				vUv,
				tDiffuse,
				resolution,
				edgeDetectionQuality, // [0,1] contrast needed, otherwise early discard
				invEdgeDetectionQuality
			);
            #include <colorspace_fragment>

		}
	`

};


const aaTarget=new THREE.WebGLRenderTarget(1,1,{depthBuffer:true,stencilBuffer:false});
const gl=renderer.getContext();
aaTarget.samples=renderer.capabilities.isWebGL2?Math.min(4,gl.getParameter(gl.MAX_SAMPLES)):0;
const aaMaterial=new THREE.ShaderMaterial({...FXAAShader,depthTest:false,depthWrite:false});
aaMaterial.uniforms.tDiffuse.value=aaTarget.texture;
const aaScene=new THREE.Scene(),aaCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const aaQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),aaMaterial);aaQuad.frustumCulled=false;aaScene.add(aaQuad);
function resizeAA(){
  const size=renderer.getDrawingBufferSize(new THREE.Vector2());
  aaTarget.setSize(size.x,size.y);aaMaterial.uniforms.resolution.value.set(1/size.x,1/size.y);
}
resizeAA();
function renderGame(){
  renderer.setRenderTarget(aaTarget);renderer.render(scene,camera);
  renderer.setRenderTarget(null);renderer.render(aaScene,aaCamera);
}


const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1330);
scene.fog = new THREE.Fog(0x0e1330, 48, 95);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 250);
let cameraSide = -1;
function updateCamera() {
  camera.aspect = innerWidth / innerHeight;
  const tanV = Math.tan((camera.fov * DEG) / 2);
  const tanH = tanV * camera.aspect;
  const D = clamp(8 / Math.max(tanH, 0.15), 28, 52);
  camera.position.set(0, 0.65 * D, cameraSide * 0.758 * D);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
updateCamera();

scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x16233a, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(10, 26, -14);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 80;
const S = 14;
sun.shadow.camera.left = -S; sun.shadow.camera.right = S;
sun.shadow.camera.top = S;   sun.shadow.camera.bottom = -S;
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const M = {
  pitch: new THREE.MeshStandardMaterial({ color: 0x2fa96b, roughness: 0.95 }),

// Rounded field and quarter-pipe ramps, using the original materials.
function fieldOutline(offset=0){
  const points=[],w=HW-RAMP_R,l=HL-RAMP_R;
  for(const [cx,cz,start] of [[w-CORNER_R,l-CORNER_R,0],[-w+CORNER_R,l-CORNER_R,90],[-w+CORNER_R,-l+CORNER_R,180],[w-CORNER_R,-l+CORNER_R,270]]){

    if(start===0)for(const x of [GOAL_W/2,-GOAL_W/2])points.push(new THREE.Vector3(x,0,l+offset));
    if(start===180)for(const x of [-GOAL_W/2,GOAL_W/2])points.push(new THREE.Vector3(x,0,-l-offset));
  }
  return points;
}

// Sphere against a circular ramp: one distance calculation, no triangle collision mesh.
function resolveRamp(ball){
  const body=ball.body,p=body.position,r=body.shapes[0].radius;
  if(Math.abs(p.x)<GOAL_W/2&&Math.abs(p.z)>=HL-RAMP_R-.01){
    const limit=GOAL_W/2-r,back=HL+GOAL_D-r;
    if(Math.abs(p.x)>limit){const side=Math.sign(p.x);p.x=side*limit;if(body.velocity.x*side>0)body.velocity.x*=-.55;body.aabbNeedsUpdate=true;}
    if(Math.abs(p.z)>back){const side=Math.sign(p.z);p.z=side*back;if(body.velocity.z*side>0)body.velocity.z*=-.55;body.aabbNeedsUpdate=true;}
    return;
  }
  const qx=Math.abs(p.x)-(HW-RAMP_R-CORNER_R),qz=Math.abs(p.z)-(HL-RAMP_R-CORNER_R);
  const ox=Math.max(qx,0),oz=Math.max(qz,0),length=Math.hypot(ox,oz);
  const d=length+Math.min(Math.max(qx,qz),0)-CORNER_R;
  if(d<=0)return;
  const nx=(length>0?ox/length:qx>qz?1:0)*(Math.sign(p.x)||1);
  const nz=(length>0?oz/length:qx>qz?0:1)*(Math.sign(p.z)||1);
  const wallDepth=d-(RAMP_R-r);
  if(wallDepth>0){
    p.x-=nx*wallDepth;p.z-=nz*wallDepth;
    const outward=body.velocity.x*nx+body.velocity.z*nz;
    if(outward>0){body.velocity.x-=1.55*outward*nx;body.velocity.z-=1.55*outward*nz;}
    body.aabbNeedsUpdate=true;
  }
  if(p.y>RAMP_R+r)return;
  const surfaceD=Math.min(d,RAMP_R-r);
  const up=Math.max(0,RAMP_R-p.y),distance=Math.hypot(surfaceD,up);
  const depth=distance-(RAMP_R-r);
  if(depth<=0||distance===0)return;
  const x=-nx*surfaceD/distance,y=up/distance,z=-nz*surfaceD/distance;
  p.x+=x*depth;p.y+=y*depth;p.z+=z*depth;
  const v=body.velocity,vn=v.x*x+v.y*y+v.z*z;
  if(vn<0){const bounce=vn < -1?(ball===football?PHYSICS.bounce:.4):0,impulse=-(1+bounce)*vn;v.x+=x*impulse;v.y+=y*impulse;v.z+=z*impulse;}
  body.angularVelocity.x=(y*v.z-z*v.y)/r;body.angularVelocity.z=(x*v.y-y*v.x)/r;body.aabbNeedsUpdate=true;
}

function applyGuestState(data) {
  if (!checkPeerBuild(data)) return;
  if (!data?.a || !data?.b || !data?.f || !Number.isFinite(data.t)) return;
  if (data.k) {
    for (let i=0;i<2;i++) Object.assign(kicks[i],data.k[i],{held:!!data.k[i].held});
  }
  guestPhase=data.phase;
  for (const [key] of actors) {
    const remote = data[key];
    if (![remote.x, remote.z].every(Number.isFinite)) return;
    guestTargets[key].position.set(remote.x,
      Number.isFinite(remote.y) ? remote.y : BALL_R, remote.z);
    if (Array.isArray(remote.q) && remote.q.length === 4 && remote.q.every(Number.isFinite)) {
      guestTargets[key].quaternion.set(...remote.q).normalize();
    }
  }
  if (!guestHasState || data.r !== guestResetGeneration) {
    guestFrames.length = 0;
    for (const [key,ball] of actors) {
      ball.group.position.copy(guestTargets[key].position);
      ball.group.quaternion.copy(guestTargets[key].quaternion);
    }
  }
  guestHasState = true;
  guestResetGeneration = data.r;
  const offset = performance.now() - data.t;
  guestClockOffset = guestClockOffset === null ? offset : Math.min(guestClockOffset, offset);
  guestFrames.push({
    t: data.t,
    a: { position: guestTargets.a.position.clone(), quaternion: guestTargets.a.quaternion.clone() },
    b: { position: guestTargets.b.position.clone(), quaternion: guestTargets.b.quaternion.clone() },
    f: { position: guestTargets.f.position.clone(), quaternion: guestTargets.f.quaternion.clone() },
  });
  if (guestFrames.length > 12) guestFrames.shift();

  if (Array.isArray(data.s) && data.s.length === 2) {
    if (data.s[0] > score[0]) showMsg('GOLO! 🔵', '#35d0ff');
    else if (data.s[1] > score[1]) showMsg('GOLO! 🔴', '#ff4d6d');
    score[0] = data.s[0]; score[1] = data.s[1];
    s0El.textContent = score[0]; s1El.textContent = score[1];
  }
}

function renderGuest(now) {
  if (!guestFrames.length) return;
  // Duas amostras do host permitem animar a 60 Hz sem saltos a cada pacote.
  const renderTime = now - guestClockOffset - 60;
  while (guestFrames.length > 2 && guestFrames[1].t <= renderTime) guestFrames.shift();
  const from = guestFrames[0];
  const to = guestFrames[1] || from;
  const blend = to.t > from.t ? clamp((renderTime - from.t) / (to.t - from.t), 0, 1) : 1;
  for (const [key, ball] of actors) {
    ball.group.position.lerpVectors(from[key].position, to[key].position, blend);
    ball.group.quaternion.slerpQuaternions(from[key].quaternion, to[key].quaternion, blend);
  }
}

const sensor = {
  ok: false, gx: 0, gy: 0,
  baseX: 0, baseY: 0, buf: [],
  calibrated: false, source: '—', lastEventTs: 0,
};
const statusEl = document.getElementById('status');
function setStatus(txt, cls = '') { statusEl.textContent = txt; statusEl.className = cls; }

function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number')
    return ((screen.orientation.angle % 360) + 360) % 360;
  const o = window.orientation;
  return typeof o === 'number' ? ((o % 360) + 360) % 360 : 0;
}
function rotateToScreen(ax, ay) {
  switch (screenAngle()) {
    case 90:  return [ ay, -ax];
    case 180: return [-ax, -ay];
    case 270: return [-ay,  ax];
    default:  return [ ax,  ay];
  }
}
function feedGravity(ax, ay, source) {
  const [sx, sy] = rotateToScreen(ax, ay);
  sensor.gx = sx; sensor.gy = sy;
  sensor.source = source; sensor.lastEventTs = performance.now();
  if (!sensor.ok) { sensor.ok = true; setStatus('sensores ativos ✓', 'ok'); netlog('sensores ativos (' + source + ')', 'ok'); }
  if (!sensor.calibrated) {
    sensor.buf.push([sx, sy]);
    if (sensor.buf.length >= 50) {
      let bx = 0, by = 0;
      for (const [x, y] of sensor.buf) { bx += x; by += y; }
      sensor.baseX = bx / sensor.buf.length;
      sensor.baseY = by / sensor.buf.length;
      sensor.calibrated = true;
      sensor.buf.length = 0;
      netlog('calibração concluída', 'ok');
    }
  }
}
function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  feedGravity(a.x, a.y, 'motion');
}
function onOrientation(e) {
  if (e.beta == null || e.gamma == null) return;
  if (sensor.source === 'motion' && performance.now() - sensor.lastEventTs < 250) return;
  const b = e.beta * DEG, g = e.gamma * DEG;
  const gx = -Math.cos(b) * Math.sin(g);
  const gy = -Math.sin(b);
  feedGravity(gx * 9.81, gy * 9.81, 'orientation');
}

/* ============================================================
   INPUT
   ============================================================ */
const input = { x: 0, y: 0 };
function updateInput(dt) {
  let ix = 0, iy = 0;
  if (sensor.ok && sensor.calibrated) {
    const dx = PHYSICS.sensitivity * INVERT_X * (sensor.gx - sensor.baseX) / 9.81 / MAX_TILT;
    const dy = PHYSICS.sensitivity * INVERT_Y * (sensor.gy - sensor.baseY) / 9.81 / MAX_TILT;
    const mag = Math.hypot(dx, dy);
    if (mag > DEADZONE) {
      const s = Math.min(1, (mag - DEADZONE) / (1 - DEADZONE)) / mag;
      ix = clamp(dx * s, -1, 1);
      iy = clamp(dy * s, -1, 1);
    }
  }
  const a = 1 - Math.exp(-18 * dt);
  input.x = lerp(input.x, ix, a);
  input.y = lerp(input.y, iy, a);
}

/* ============================================================
   Física e IA
   ============================================================ */
function servo(body, ix, iy, dt) {
  const k = 1 - Math.exp(-PHYSICS.response * dt / Math.sqrt(PHYSICS.playerMass));
  body.velocity.x = lerp(body.velocity.x, ix * PHYSICS.speed, k);
  body.velocity.z = lerp(body.velocity.z, iy * PHYSICS.speed, k);
}

/* Chute: toda a física é decidida pelo host (ou pelo treino local). */
const kicks = [0,1].map(() => ({energy:100,cooldown:0,held:false,charge:0,burst:0,startAt:0,rest:0}));
let localKickHeld = false, kickSequence = 0, remoteKickSequence = -1, kickPointer = null;
let localKickStart=0,localReleaseBurst=0;
function resetKicks() {
  localKickHeld = false; kickPointer=null; localReleaseBurst=0;
  for (const k of kicks) Object.assign(k,{energy:100,cooldown:0,held:false,charge:0,burst:0,rest:0});
  for (const player of [ballA,ballB]) inflatePlayer(player,1);
}
function canPlay() {
  return gameRunning && (training || peerConnected) && overlay.classList.contains('hidden') &&
    (isHost ? resetTimer<=0 && kickoffTimer<=0 : guestPhase==='play');
}
function inflatePlayer(player,scale) {
  player.group.scale.setScalar(scale);
  const compression=clamp((1-scale)/.38,0,1),expansion=clamp((scale-1)/.42,0,1);
  const hsl=player.baseHsl;
  player.group.children[0].material.color.setHSL(hsl.h,clamp(hsl.s+(1-hsl.s)*compression-expansion*hsl.s*.55,0,1),clamp(hsl.l*(1-.3*compression)+(1-hsl.l)*expansion*.55,0,1));
  const shape = player.body.shapes[0];
  const radius = BALL_R*scale;
  if (isHost && Math.abs(shape.radius-radius)>.005) {
    shape.radius=radius; shape.updateBoundingSphereRadius();
    player.body.updateBoundingRadius(); player.body.updateMassProperties(); player.body.aabbNeedsUpdate=true;
  }
}
function kickImpulse(index, strength) {
  const player = index===0?ballA:ballB;
  const dx=football.body.position.x-player.body.position.x;
  const dz=football.body.position.z-player.body.position.z;
  const distance=Math.hypot(dx,dz);
  if (distance > BALL_R*player.group.scale.x+FOOTBALL_R+PHYSICS.reach ||
      Math.abs(football.body.position.y-player.body.position.y)>1.6) return;
  const ux=distance>.01?dx/distance:0, uz=distance>.01?dz/distance:(index===0?1:-1);
  const impulse=PHYSICS.kickForce*strength;
  football.body.wakeUp();
  football.body.applyImpulse(new CANNON.Vec3(ux*impulse,impulse*.08*strength,uz*impulse));
  if (football.body.velocity.length()>35) football.body.velocity.scale(35/football.body.velocity.length(),football.body.velocity);
}
function kickEvent(index,action) {
  const k=kicks[index];
  if (action==='cancel') { k.held=false; k.charge=0; k.cooldown=Math.max(k.cooldown,PHYSICS.cooldown); return; }
  if (!gameRunning || resetTimer>0 || kickoffTimer>0 || (!training && !peerConnected)) return;
  if (action==='down') {
    if (k.held || k.cooldown>0 || k.energy<6) return;
    k.held=true; k.startAt=performance.now(); k.charge=0; k.burst=0; k.rest=.7;
    k.energy=Math.max(0,k.energy-6);

  } else if (action==='up' && k.held) {
    const charge=clamp((performance.now()-k.startAt)/1000/PHYSICS.chargeTime,0,1);
    k.held=false; k.charge=0;
    const power=charge>.12?charge:0;
    const cost=(PHYSICS.fatigue-6)*power;
    const available=Math.min(1,k.energy/Math.max(cost,1));
    k.burst=.18+.24*power;
    inflatePlayer(index===0?ballA:ballB,1+k.burst);
    kickImpulse(index,(.18+.82*power)*(.35+.65*k.energy/100)*available);
    k.energy=Math.max(0,k.energy-cost);
    k.cooldown=PHYSICS.cooldown*(1+.6*charge); k.rest=.8;
  }
}
function sendKick(action) {
  if (isHost) kickEvent(0,action);
  else if (kickAction && peerConnected) kickAction.send({v:GAME_BUILD,action,id:++kickSequence})
    .catch(e=>netlog('erro no chute: '+e.message,'er'));
}
function beginLocalKick() {
  if (localKickHeld || !canPlay()) return;
  const k=kicks[isHost?0:1];
  if(k.cooldown>0 || k.energy<6) return;

function endLocalKick(cancel=false) {

function updateKicks(dt) {

    if(k.held) k.charge=clamp((performance.now()-k.startAt)/1000/PHYSICS.chargeTime,0,1);
    else if(k.rest===0) k.energy=Math.min(100,k.energy+PHYSICS.recovery*dt);

    const held=localGuest?localKickHeld:k.held;

// Observa a ligação WebRTC sem alterar ofertas, candidatos ou mensagens.
const peerDiagnostics = [];
class DiagnosticPeerConnection extends RTCPeerConnection {
  constructor(config) {
    super(config);
    const id = peerDiagnostics.length + 1;
    const info = { id, pc: this, host: 0, srflx: 0, relay: 0, other: 0 };
    peerDiagnostics.push(info);
    netlog(`PC ${id} criado`);
    this.addEventListener('signalingstatechange', () =>
      netlog(`PC ${id} sinalização: ${this.signalingState}`));
    this.addEventListener('icegatheringstatechange', () =>
      netlog(`PC ${id} recolha ICE: ${this.iceGatheringState}`));
    this.addEventListener('iceconnectionstatechange', () =>
      netlog(`PC ${id} ICE: ${this.iceConnectionState}`,
        this.iceConnectionState === 'failed' ? 'er' : ''));
    this.addEventListener('connectionstatechange', () =>
      netlog(`PC ${id} ligação: ${this.connectionState}`,
        this.connectionState === 'failed' ? 'er' : ''));
    this.addEventListener('icecandidate', event => {
      const candidate = event.candidate;
      if (candidate) {
        const type = candidate.type || / typ (host|srflx|relay|prflx)/.exec(candidate.candidate)?.[1];
        if (type in info) info[type]++;
        else info.other++;
      } else {
        netlog(`PC ${id} candidatos: host=${info.host} srflx=${info.srflx} relay=${info.relay} outros=${info.other}`);
      }
    });
    this.addEventListener('icecandidateerror', event =>
      netlog(`PC ${id} erro ICE ${event.errorCode}: ${event.errorText || 'sem detalhe'}`, 'wn'));
  }
}

const observedRelaySockets = new WeakSet();
const relayDiagnostics = new Map();
function observeRelaySockets() {
  try {
    for (const [url, socket] of Object.entries(getRelaySockets?.() || {})) {
      if (!socket || observedRelaySockets.has(socket)) continue;
      observedRelaySockets.add(socket);
      const stats = { events: 0, accepted: 0, rejected: 0, subscriptions: 0 };
      relayDiagnostics.set(url, stats);
      socket.addEventListener('message', event => {
        let data;
        try { data = JSON.parse(event.data); } catch (_) { return; }
        if (data[0] === 'EVENT') {
          stats.events++;
          if (stats.events <= 3) netlog(`relay ${url}: sinal recebido #${stats.events}`, 'ok');
        } else if (data[0] === 'OK') {
          if (data[2]) stats.accepted++;
          else {
            stats.rejected++;
            netlog(`relay ${url}: envio rejeitado (${data[3] || 'sem motivo'})`, 'er');
          }
        } else if (data[0] === 'EOSE') {
          stats.subscriptions++;
          if (stats.subscriptions === 1) netlog(`relay ${url}: subscrição ativa`, 'ok');
        } else if (data[0] === 'CLOSED' || data[0] === 'NOTICE') {
          netlog(`relay ${url}: ${data[0]} ${data[2] || data[1] || ''}`, 'wn');
        }
      });
      socket.addEventListener('close', event =>
        netlog(`relay ${url}: socket fechado (${event.code})`, 'wn'));
      socket.addEventListener('error', () =>
        netlog(`relay ${url}: erro de socket`, 'wn'));
    }
  } catch (e) { netlog('diagnóstico dos relays: ' + e.message, 'wn'); }
}

function logConnectionSnapshot() {
  for (const [url, stats] of relayDiagnostics) {
    netlog(`relay ${url}: recebidos=${stats.events}, aceites=${stats.accepted}, rejeitados=${stats.rejected}, subscrições=${stats.subscriptions}`);
  }
  if (!peerDiagnostics.length) netlog('nenhuma ligação WebRTC criada', 'wn');
  for (const info of peerDiagnostics) {
    netlog(`PC ${info.id}: sinalização=${info.pc.signalingState}, ICE=${info.pc.iceConnectionState}, candidatos host=${info.host} srflx=${info.srflx} relay=${info.relay}`);
  }
}

/* Código de sala por áudio: tom inicial + 5 símbolos base36 + verificação. */
const AUDIO_ALPHABET = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const AUDIO_START_HZ = 600;
const AUDIO_SYMBOL_HZ = n => 950 + n * 65;
let audioReceiver = null;
let audioSender = null;

function audioChecksum(code) {
  return [...code].reduce((sum, char, i) =>
    sum + (i + 1) * AUDIO_ALPHABET.indexOf(char), 0) % 36;
}

function stopAudioReceiver() {
  if (!audioReceiver) return;
  const { stream, context, timer } = audioReceiver;
  clearInterval(timer);
  stream.getTracks().forEach(track => track.stop());
  context.close().catch(() => {});
  audioReceiver = null;
}

async function emitRoomCode() {
  if (audioSender || !roomCode) return;
  const btn = document.getElementById('btnEmit');
  const hint = document.getElementById('audioHint');
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error('Áudio indisponível neste navegador.');
    const context = new AudioContextClass();
    audioSender = context;
    await context.resume();
    if (btn) btn.disabled = true;
    if (hint) hint.textContent = 'A emitir… aproxima os telemóveis.';
    const symbols = [...roomCode].map(char => AUDIO_ALPHABET.indexOf(char));
    symbols.push(audioChecksum(roomCode));
    const tones = [AUDIO_START_HZ, ...symbols.map(AUDIO_SYMBOL_HZ)];
    let at = context.currentTime + 0.08;
    tones.forEach((frequency, i) => {
      const duration = i === 0 ? 0.48 : 0.28;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0, at);
      gain.gain.linearRampToValueAtTime(0.42, at + 0.02);
      gain.gain.setValueAtTime(0.42, at + duration - 0.02);
      gain.gain.linearRampToValueAtTime(0, at + duration);
      oscillator.connect(gain).connect(context.destination);
      oscillator.start(at);
      oscillator.stop(at + duration + 0.01);
      at += duration + 0.18;
    });
    await new Promise(resolve => setTimeout(resolve, Math.ceil((at - context.currentTime) * 1000)));
    if (hint?.isConnected) hint.textContent = 'Código emitido. Podes emitir novamente.';
  } catch (e) {
    netlog('erro a emitir código: ' + e.message, 'er');
    if (hint?.isConnected) hint.textContent = e.message;
  } finally {
    const context = audioSender;
    audioSender = null;
    if (context) context.close().catch(() => {});
    if (btn?.isConnected) btn.disabled = false;
  }
}

function detectedTone(samples, sampleRate) {
  let best = -1, bestPower = 0, nextPower = 0;
  for (let i = -1; i < 36; i++) {
    const frequency = i < 0 ? AUDIO_START_HZ : AUDIO_SYMBOL_HZ(i);
    const coefficient = 2 * Math.cos(2 * Math.PI * frequency / sampleRate);
    let previous = 0, before = 0;
    for (let j = 0; j < samples.length; j++) {
      const value = samples[j] + coefficient * previous - before;
      before = previous;
      previous = value;
    }
    const power = previous * previous + before * before - coefficient * previous * before;
    if (power > bestPower) {
      nextPower = bestPower;
      bestPower = power;
      best = i;
    } else if (power > nextPower) {
      nextPower = power;
    }
  }
  // Amplitude aproximada do tom; a margem rejeita fala e ruído ambiente.
  return 2 * Math.sqrt(bestPower) / samples.length > 0.004 &&
    bestPower > nextPower * 1.5 ? best : null;
}

async function listenForRoomCode() {
  const btn = document.getElementById('btnListen');
  const hint = document.getElementById('audioHint');
  if (audioReceiver) {
    stopAudioReceiver();
    btn.textContent = 'Ouvir';
    hint.textContent = 'Escuta parada.';
    return;
  }
  if (!navigator.mediaDevices?.getUserMedia || !(window.AudioContext || window.webkitAudioContext)) {
    hint.textContent = 'Microfone indisponível. Abre o jogo em HTTPS.';
    return;
  }
  btn.disabled = true;
  hint.textContent = 'A pedir acesso ao microfone…';
  let stream, context;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false
    } });
    // O utilizador pode ter voltado ao menu enquanto autorizava o microfone.
    if (!btn.isConnected) { stream.getTracks().forEach(t => t.stop()); return; }
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    context = new AudioContextClass();
    await context.resume();
    const source = context.createMediaStreamSource(stream);
    const analyser = context.createAnalyser();
    analyser.fftSize = 4096;
    source.connect(analyser);
    const samples = new Float32Array(analyser.fftSize);
    const receiver = { stream, context, timer: null };
    audioReceiver = receiver;
    btn.disabled = false;
    btn.textContent = 'Parar de ouvir';
    hint.textContent = 'À escuta… toca em “Emitir” no outro telemóvel.';
    const SYMBOL_PERIOD_MS = 460;
    let started = false, startVotes = 0, firstTone = null;
    let firstToneVotes = 0, firstSymbolAt = 0, currentSlot = 0;
    let votes = [], symbols = [];
    const resetPacket = (message) => {
      started = false;
      startVotes = 0;
      firstTone = null;
      firstToneVotes = 0;
      firstSymbolAt = 0;
      currentSlot = 0;
      votes = [];
      symbols = [];
      hint.textContent = message;
    };
    const finishSymbol = () => {
      const counts = new Map();
      votes.forEach(n => counts.set(n, (counts.get(n) || 0) + 1));
      const [value, count] = [...counts].sort((a, b) => b[1] - a[1])[0] || [];
      votes = [];
      if (count < 2) {
        netlog(`som incompleto no símbolo ${symbols.length + 1}/6`, 'wn');
        resetPacket('Não consegui ouvir tudo. Pede para emitir novamente.');
        return false;
      }
      symbols.push(value);
      hint.textContent = `A receber código… ${symbols.length}/6`;
      if (symbols.length !== 6) return true;
      const code = symbols.slice(0, 5).map(n => AUDIO_ALPHABET[n]).join('');
      if (audioChecksum(code) !== symbols[5]) {
        netlog('código áudio não passou na verificação', 'wn');
        resetPacket('Código não reconhecido. Pede para emitir novamente.');
        return false;
      }
      netlog('código recebido por áudio: ' + code, 'ok');
      document.getElementById('roomInput').value = code;
      stopAudioReceiver();
      joinRoomWithCode(code);
      return false;
    };
    receiver.timer = setInterval(() => {
      analyser.getFloatTimeDomainData(samples);
      const tone = detectedTone(samples, context.sampleRate);
      const now = performance.now();
      if (!started) {
        startVotes = tone === -1 ? startVotes + 1 : 0;
        if (startVotes >= 3) {
          started = true;
          firstTone = null;
          firstToneVotes = 0;
          hint.textContent = 'A receber código…';
        }
        return;
      }
      if (!firstSymbolAt) {
        if (tone === null || tone < 0) return;
        firstToneVotes = tone === firstTone ? firstToneVotes + 1 : 1;
        firstTone = tone;
        if (firstToneVotes >= 2) {
          firstSymbolAt = now;
          votes.push(tone);
        }
        return;
      }
      // Cada símbolo ocupa um intervalo conhecido. O fim do último é
      // reconhecido pelo relógio, mesmo quando o microfone não fica silencioso.
      const slot = Math.floor((now - firstSymbolAt + 50) / SYMBOL_PERIOD_MS);
      while (currentSlot < slot && currentSlot < 6) {
        if (!finishSymbol()) return;
        currentSlot++;
      }
      if (slot >= 6) {
        resetPacket('Código incompleto. Pede para emitir novamente.');
        return;
      }
      if (tone !== null && tone >= 0 &&
          now - firstSymbolAt - slot * SYMBOL_PERIOD_MS < 320) {
        votes.push(tone);
      }
    }, 30);
  } catch (e) {
    stream?.getTracks().forEach(track => track.stop());
    context?.close().catch(() => {});
    netlog('erro ao ouvir código: ' + e.message, 'er');
    if (hint?.isConnected) hint.textContent = 'Não foi possível usar o microfone. Confirma a permissão e o HTTPS.';
    if (btn?.isConnected) btn.disabled = false;
  }
}

function relaySummary() {
  try {
    const sockets = getRelaySockets?.() || {};
    const entries = Object.entries(sockets);
    const urls = entries.filter(([, ws]) => ws?.readyState === WebSocket.OPEN)
      .map(([url]) => url);
    return { total: entries.length, open: urls.length, urls };
  } catch (_) {
    return { total: 0, open: 0, urls: [] };
  }
}

function startRelayWatch() {
  clearInterval(relayWatchInterval);
  let last = '';
  relayWatchInterval = setInterval(() => {
    if (!room || peerConnected) return;
    observeRelaySockets();
    const { total, open, urls } = relaySummary();
    const sig = urls.join(',');
    if (sig !== last) {
      netlog(`relays Nostr ligados: ${open}/${total}`, open ? 'ok' : 'wn');
      if (open) netlog('relays ativos: ' + urls.join(', '));
      last = sig;
    }
    if (open > 0) {
      setStatus(isHost ? 'sala anunciada — à espera do adversário…' : 'relay ligado — a procurar host…', 'warn');
    } else {
      setStatus('a ligar aos relays…', 'warn');
    }
  }, 1000);
}

function handleJoinError(details) {
  const err = details?.error;
  const msg = err?.message || String(err || 'erro desconhecido');
  const peer = details?.peerId ? ` peer=${details.peerId}` : '';
  if (details?.peerId) webrtcJoinFailed = true;
  netlog(`falha WebRTC${peer}: ${msg}`, 'er');
  logConnectionSnapshot();
  setStatus('falha de ligação WebRTC', 'err');
}

function setupRoom(code, host) {
  cleanupRoom();
  webrtcJoinFailed = false;
  peerVersionMismatch = false;
  peerDiagnostics.length = 0;
  for (const stats of relayDiagnostics.values()) {
    stats.events = stats.accepted = stats.rejected = stats.subscriptions = 0;
  }
  isHost = host;
  roomCode = code;
  cameraSide = host ? -1 : 1;
  buildInfo.textContent = `Jogo ${GAME_BUILD} · ${host ? 'Host 🔵' : 'Convidado 🔴'}`;
  updateCamera();
  resetGeneration = 0;
  resetMatch();

  netlog(`joinRoom: app=${APP_ID} sala=${roomCode} Trystero=0.25.4`);
  room = joinRoom({ ...ROOM_CONFIG, rtcPolyfill: DiagnosticPeerConnection },
    roomCode, { onJoinError: handleJoinError });
  observeRelaySockets();
  online = true;
  netlog('sala inicializada localmente', 'ok');

  stateAction = room.makeAction('state');
  inputAction = room.makeAction('input');
  kickAction = room.makeAction('kick');
  remoteKickSequence=-1; kickSequence=0;
  kickAction.onMessage=(data)=>{
    if(!isHost || !checkPeerBuild(data) || !Number.isSafeInteger(data.id) || data.id<=remoteKickSequence) return;
    remoteKickSequence=data.id;
    if(['down','up','cancel'].includes(data.action)) kickEvent(1,data.action);
  };

  if (!stateAction?.send || !('onMessage' in stateAction)) {
    throw new Error('API Trystero inesperada em action "state"');
  }
  if (!inputAction?.send || !('onMessage' in inputAction)) {
    throw new Error('API Trystero inesperada em action "input"');
  }

  room.onPeerJoin = (peerId) => {
    if (isHost && !peerConnected) resetMatch();
    peerConnected = true;
    clearTimeout(joinTimeout);
    netlog('peer ligado: ' + peerId, 'ok');
    setStatus(isHost ? 'adversário ligado ✓' : 'ligado ao host ✓', 'ok');
    startGame();
  };

  room.onPeerLeave = (peerId) => {
    endLocalKick(true);resetKicks();
    peerConnected = false;
    netlog('peer saiu: ' + peerId, 'wn');
    setStatus('adversário saiu', 'warn');
  };

  startRelayWatch();
}

/* ----------------------------------------------------------
   Criar sala
---------------------------------------------------------- */
function createRoom() {
  netlog('botão "Criar sala" clicado');
  try {
    const code = Math.random().toString(36).slice(2, 7).toUpperCase();
    setupRoom(code, true);

    inputAction.onMessage = (data) => {
      if (!checkPeerBuild(data)) return;
      remoteInput.x = Number(data.x) || 0;
      remoteInput.y = Number(data.y) || 0;
    };

    stateInterval = setInterval(() => {
      if (!peerConnected) return;
      stateAction.send({
        v: GAME_BUILD,
        t: performance.now(),
        a: ballSnapshot(ballA),
        b: ballSnapshot(ballB),
        f: ballSnapshot(football),
        k: kicks.map(({energy,cooldown,held,charge,burst})=>({energy,cooldown,held,charge,burst})),
        phase:resetTimer>0?'goal':kickoffTimer>0?'ready':'play',
        s: [score[0], score[1]],
        r: resetGeneration,
      }).catch(e => netlog('erro a enviar state: ' + e.message, 'er'));
    }, 33);

    showOverlayHostWaiting(roomCode);
    setStatus('a ligar aos relays…', 'warn');
  } catch (e) {
    netlog('ERRO em createRoom: ' + e.message, 'er');
    cleanupRoom();
    showOverlayError('Erro ao criar sala: ' + e.message);
  }
}

/* ----------------------------------------------------------
   Entrar em sala
---------------------------------------------------------- */
function joinRoomWithCode(code) {
  netlog('a entrar na sala "' + code + '"');
  try {
    setupRoom(code, false);

    stateAction.onMessage = applyGuestState;

    inputInterval = setInterval(() => {
      if (!peerConnected) return;
      inputAction.send({ v: GAME_BUILD, x: -input.x, y: -input.y })
        .catch(e => netlog('erro a enviar input: ' + e.message, 'er'));
    }, 33);

    joinTimeout = setTimeout(() => {
      if (!peerConnected) {
        const { total, open } = relaySummary();
        const detail = open === 0
          ? 'Não foi possível contactar os relays de matchmaking.'
          : webrtcJoinFailed
            ? 'O host respondeu, mas a ligação WebRTC entre os telemóveis falhou.'
            : 'Os relays estão ligados, mas o host não foi encontrado. Confirma o código e que o host continua na sala.';
        netlog(`timeout: nenhum peer após 20s (relays ${open}/${total})`, 'er');
        logConnectionSnapshot();
        showOverlayError(detail);
      }
    }, 20000);

    showOverlayJoining();
    setStatus('a ligar aos relays…', 'warn');
  } catch (e) {
    netlog('ERRO em joinRoomWithCode: ' + e.message, 'er');
    cleanupRoom();
    showOverlayError('Erro ao entrar: ' + e.message);
  }
}

function startGame() {
  gameRunning = true;
  document.getElementById('overlay').classList.add('hidden');
  setStatus('jogo a correr', 'ok');
  netlog('jogo iniciado', 'ok');
}

  netlogEl = document.getElementById('netlog');

/* ============================================================
   Pedido de sensores
   ============================================================ */
let sensorPermissionPending=false;
async function requestSensors(userGesture=false){
  window.addEventListener('devicemotion',onMotion,true);
  window.addEventListener('deviceorientation',onOrientation,true);
  if(!window.isSecureContext){setStatus('Os sensores precisam de HTTPS','err');return;}
  const permissionAPIs=[window.DeviceMotionEvent,window.DeviceOrientationEvent].filter(api=>typeof api?.requestPermission==='function');
  if(permissionAPIs.length&&!userGesture){
    document.addEventListener('pointerdown',()=>requestSensors(true),{once:true,capture:true});
    return;
  }
  if(permissionAPIs.length&&!sensorPermissionPending){
    sensorPermissionPending=true;
    const permissions=await Promise.allSettled(permissionAPIs.map(api=>api.requestPermission()));
    if(permissions.every(p=>p.status==='rejected'||p.value!=='granted'))setStatus('Permite movimento nas definições do navegador','warn');
    sensorPermissionPending=false;
  }
}

/* ============================================================
   Loop principal
   ============================================================ */
let last = performance.now();

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  updateInput(dt);
  updateKicks(dt);

  if (gameRunning && isHost && resetTimer > 0) {
    resetTimer -= dt;
    for (const [,ball] of actors) ball.body.velocity.setZero();
    if (resetTimer <= 0) { if(training) prepareTrainingAttempt(); else resetPositions(); }
  } else if (gameRunning && isHost && kickoffTimer > 0) {
    kickoffTimer = Math.max(0, kickoffTimer - dt);
  } else if (gameRunning && isHost && (peerConnected || training)) {
    servo(ballA.body, input.x, input.y, dt);
    if (online) servo(ballB.body, remoteInput.x, remoteInput.y, dt);
    world.step(1/120, dt, 8);
    if (actors.some(([,ball])=>ball.body.position.y < -5)) { if(training) prepareTrainingAttempt(); else resetPositions(); }
    else checkGoal();
    if(training) updateTraining(dt);
  } else if (isHost) {
    ballA.body.velocity.setZero();
    ballB.body.velocity.setZero();
  }

  if (isHost || !online) {
    for (const [,ball] of actors) {
      ball.group.position.copy(ball.body.position);
      ball.group.quaternion.copy(ball.body.quaternion);
    }
  } else if (guestHasState) {
    renderGuest(now);
  }

  renderGame();
}
requestAnimationFrame(tick);

document.getElementById('btnCal').addEventListener('click', () => {

  sensor.calibrated = false;
  sensor.buf.length = 0;
  showMsg('Calibrado', '#9ee7ff');
});

renderer.domElement.addEventListener('pointerdown',e=>{
  if(e.button!==0 || kickPointer!==null || localKickHeld) return;
  e.preventDefault();beginLocalKick();
  if(localKickHeld){kickPointer=e.pointerId;renderer.domElement.setPointerCapture(e.pointerId);}
});
renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===kickPointer){kickPointer=null;endLocalKick();}});
renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===kickPointer){kickPointer=null;endLocalKick(true);}});
renderer.domElement.addEventListener('lostpointercapture',e=>{if(e.pointerId===kickPointer){kickPointer=null;endLocalKick(true);}});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&e.target===document.body){e.preventDefault();beginLocalKick();}});
window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();endLocalKick();}});
window.addEventListener('blur',()=>endLocalKick(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)endLocalKick(true);});
document.getElementById('btnMenu').onclick=()=>{cleanupRoom();showOverlayMenu();};

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  resizeAA();
  updateCamera();
});
addEventListener('orientationchange', () => {
  sensor.calibrated = false;
  sensor.buf.length = 0;
});

/* ============================================================
   Arranque
   ============================================================ */
applyPhysics();
showOverlayMenu();
requestSensors();
